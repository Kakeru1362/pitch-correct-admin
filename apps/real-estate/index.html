<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不動産さがし</title>
<style>
  :root{--bg:#0e1116;--card:#171c24;--line:#2a323d;--txt:#e9eef5;--sub:#9aa7b6;--accent:#5b8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    line-height:1.6;padding:24px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:8px 0 4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
  .card .ic{font-size:40px}
  .card p{color:var(--sub);font-size:13px;margin:8px 0 0}
  a.back{display:inline-block;margin-top:20px;color:var(--accent);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 不動産さがし</h1>
  <div class="sub">物件検索アプリ（開発中）</div>

  <div class="card">
    <span class="ic">🚧</span>
    <p>このアプリは現在開発中です。</p>
  </div>

  <a class="back" href="../index.html">‹ アプリ一覧へ戻る</a>
</div>
</body>
</html>
